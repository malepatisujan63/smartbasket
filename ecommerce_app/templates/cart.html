<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRec — Shopping Cart</title>
    <meta name="description" content="Review your cart and proceed to checkout.">
    <link rel="stylesheet" href="/static/css/google_glass.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand-title" onclick="window.location.href='/home'" style="cursor:pointer;">SmartRec</div>
        <nav class="nav-right">
            <span class="nav-link" onclick="window.location.href='/home'">Continue Shopping</span>
        </nav>
    </nav>

    <div class="app-container" style="padding-top: 40px;">
        <h1 style="font-size: 2rem; margin-bottom: 6px;">Cart</h1>
        <p style="font-size:13px; color:var(--light); margin-bottom: 0; text-transform:uppercase; letter-spacing:0.07em;">
            <span id="cart-item-count">0</span> items
        </p>

        <div class="cart-container">
            <div id="cart-list"></div>

            <div>
                <div class="summary-card">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Items (<span id="sum-qty">0</span>)</span>
                        <span id="sum-subtotal">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (8%)</span>
                        <span id="sum-tax">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span style="font-weight:600;">Free</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="sum-total">₹0</span>
                    </div>
                    <button class="btn btn-primary btn-full" id="btn-checkout" style="margin-top: 24px;" disabled>
                        Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="premium-footer">
        <div class="footer-links">
            <a href="/home">Shop</a>
            <a href="#">Help</a>
        </div>
        <p>© 2026 SmartRec</p>
    </footer>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/cart.js"></script>
</body>
</html>
