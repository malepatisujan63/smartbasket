<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile — SmartRec</title>
    <link rel="stylesheet" href="/static/css/google_glass.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand-title" onclick="window.location.href='/home'">SmartRec</div>

        <form class="search-bar" id="search-form">
            <input type="text" id="search-input" class="form-control" style="border-radius: 50px 0 0 50px; border-right:none; padding-left: 20px;" placeholder="Search products…">
            <button type="submit" class="search-btn">&#8594;</button>
        </form>

        <nav class="nav-right">
            <div class="toggle-container" title="Toggle Semantic AI Search">
                <span>AI</span>
                <label class="switch">
                    <input type="checkbox" id="smart-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <a href="/home" class="nav-link" style="margin-right: 16px; font-weight: 600; text-decoration: none;">Home</a>
            <a href="/categories" class="nav-link" style="margin-right: 16px; font-weight: 600; text-decoration: none;">Categories</a>
            <a href="/profile" class="nav-link" id="user-display" style="text-decoration: none;">Profile</a>
            <span class="nav-link cart-icon" id="cart-btn" onclick="window.location.href='/cart'" title="Cart">
                Cart
                <span class="cart-counter" id="cart-counter">0</span>
            </span>
            <button id="btn-logout" onclick="handleLogout()" class="btn btn-secondary" style="padding: 8px 20px; font-size: 13px; margin-left: 8px;">Logout</button>
        </nav>
    </nav>

    <!-- Main content area -->
    <div class="app-container" style="max-width: 1200px; margin: 40px auto; padding: 0 40px;">
        <h1 style="font-size: 2.5rem; letter-spacing: -0.03em; margin-bottom: 40px; color: var(--dark);" id="profile-greeting">Your Profile</h1>
        
        <div id="loading" style="text-align:center; padding:60px 0;">
            <div class="spinner" style="margin: 0 auto 16px;"></div>
            <p style="font-size:13px; color:var(--light); text-transform:uppercase; letter-spacing:0.08em;">Loading profile data…</p>
        </div>

        <div id="profile-content" style="display: none;">
            
            <!-- Most Viewed Items -->
            <div class="feed-section" id="most-viewed-section" style="display: none;">
                <h3 class="feed-title">Your Most Viewed Items</h3>
                <div class="carousel-container">
                    <div class="product-carousel" id="most-viewed-carousel"></div>
                </div>
            </div>

            <!-- Past Viewed Items -->
            <div class="feed-section" id="past-viewed-section" style="display: none;">
                <h3 class="feed-title">Recently Viewed</h3>
                <div class="carousel-container">
                    <div class="product-carousel" id="past-viewed-carousel"></div>
                </div>
            </div>

            <!-- Orders -->
            <div class="feed-section" id="orders-section" style="display: none; margin-top: 60px;">
                <h3 class="feed-title">Your Orders</h3>
                <div id="orders-list" style="display: grid; gap: 16px;">
                    <!-- Order Items generated by JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="premium-footer">
        <div class="footer-links">
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="/home">Shop</a>
            <a href="/admin">Admin</a>
        </div>
        <p>© 2026 SmartRec · FAISS + CatBoost · 1,426,337 products</p>
    </footer>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/profile.js"></script>
    <script>
        function handleLogout() {
            localStorage.removeItem('user_id');
            localStorage.removeItem('username');
            localStorage.removeItem('cart');
            window.location.href = '/';
        }
    </script>
</body>
</html>
