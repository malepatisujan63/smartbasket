<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRec — Sign In</title>
    <meta name="description" content="Sign in to SmartRec — AI-powered personalized shopping.">
    <link rel="stylesheet" href="/static/css/google_glass.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left: Brand Panel -->
        <div class="auth-left">
            <div class="brand-title" style="color:rgba(255,255,255,0.5); margin-bottom: 60px; font-size:14px;">SmartRec</div>
            <div>
                <h1>Shopping,<br>made for you.</h1>
                <p style="margin-top:16px;">Our ML engine learns your preferences and surfaces the products most likely to delight you — every single visit.</p>
            </div>
            <div class="auth-tagline">FAISS · CatBoost · 1.4M Products</div>
        </div>

        <!-- Right: Form -->
        <div class="auth-right">
            <div class="auth-card">
                <h2>Welcome back</h2>
                <p class="auth-subtitle">Sign in or create an account to continue.</p>

                <div class="auth-tabs">
                    <div class="auth-tab active" id="tab-login">Sign In</div>
                    <div class="auth-tab" id="tab-register">Register</div>
                </div>

                <form id="auth-form" autocomplete="off">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Your username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Your password" required>
                    </div>
                    <button type="submit" id="btn-login" class="btn btn-primary btn-full" style="margin-top:4px;">
                        Sign In
                    </button>
                    <button type="button" id="btn-register" class="btn btn-primary btn-full" style="display:none; margin-top:4px;">
                        Create Account
                    </button>
                    <p id="error-msg"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const tabLogin    = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const btnLogin    = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');
        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active'); tabRegister.classList.remove('active');
            btnLogin.style.display = 'flex'; btnRegister.style.display = 'none';
        });
        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active'); tabLogin.classList.remove('active');
            btnLogin.style.display = 'none'; btnRegister.style.display = 'flex';
        });
    </script>
</body>
</html>
