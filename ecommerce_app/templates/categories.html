<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — SmartRec</title>
    <link rel="stylesheet" href="/static/css/google_glass.css">
    <style>
        #debug-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #000; color: #0f0; font: 11px monospace;
            padding: 4px 12px; z-index: 9999; max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand-title" onclick="window.location.href='/home'">SmartRec</div>
        <form class="search-bar" id="search-form">
            <input type="text" id="search-input" class="form-control"
                   style="border-radius:50px 0 0 50px;border-right:none;padding-left:20px;"
                   placeholder="Search products…">
            <button type="submit" class="search-btn">&#8594;</button>
        </form>
        <nav class="nav-right">
            <div class="toggle-container" title="Toggle AI Search">
                <span>AI</span>
                <label class="switch">
                    <input type="checkbox" id="smart-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <a href="/categories" class="nav-link" style="margin-right:16px;font-weight:600;">Categories</a>
            <a href="/profile" class="nav-link" id="user-display" style="text-decoration:none;">Account</a>
            <span class="nav-link cart-icon" id="cart-btn" onclick="window.location.href='/cart'" title="Cart">
                Cart <span class="cart-counter" id="cart-counter">0</span>
            </span>
        </nav>
    </nav>

    <!-- Categories Layout -->
    <div class="categories-layout">
        <div class="categories-sidebar" id="categories-sidebar">
            <div style="font-size:12px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;padding-left:14px;">All Categories</div>
            <div id="category-list">
                <div style="padding:20px;color:var(--mid);font-size:13px;">Loading…</div>
            </div>
        </div>
        <div class="categories-main" id="categories-main">
            <div style="text-align:center;padding:100px 0;color:var(--mid);">
                Select a category from the left to explore.
            </div>
        </div>
    </div>

    <!-- Debug bar (only visible if error) -->
    <div id="debug-bar" style="display:none;"></div>

    <!-- Footer -->
    <footer class="premium-footer">
        <div class="footer-links">
            <a href="/home">Shop</a>
            <a href="/admin">Admin</a>
        </div>
        <p>© 2026 SmartRec · 1,426,337 products</p>
    </footer>

    <script src="/static/js/categories.js"></script>
</body>
</html>
